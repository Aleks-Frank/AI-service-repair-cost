server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend ограничивает весь JSON десятью MiB, включая base64 фотографий.
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/v1/ {
        # Без завершающего /: сохраняем /api/v1/ в пути backend.
        # Docker DNS позволяет пережить пересоздание контейнера backend.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://backend:8000;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        # Создание заявки быстро возвращает 202; генерация идёт в фоне.
        proxy_intercept_errors off;
    }

    location / {
        try_files $uri $uri/ =404;
        # Изменения контракта API не должны оставаться в старом кэше браузера.
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
    }
}
